[project]
name = "stock-market-analytics-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexis", email = "alexispd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "eurostat==1.1.1",
    "gdown==6.4.0",
    "matplotlib==3.11.1",
    "nbformat==5.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pandas-datareader==0.11.1",
    "plotly==7.0.0",
    "pyarrow==25.0.1",
    "ta-lib==0.8.1",
    "yfinance==1.7.0",
]

[project.scripts]
stock-market-analytics-zoomcamp = "stock_market_analytics_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
]
